name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
    - cron: "30 4 1 * *"     # monthly heartbeat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wake apps
        run: python wake.py

      - name: Monthly heartbeat (stops GitHub pausing this job)
        if: ${{ always() && github.event.schedule == '30 4 1 * *' }}
        run: |
          date -u > heartbeat.txt
          git config user.name "keep-awake-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Monthly heartbeat"
          git push
